name: Mobile CI

on:
  push:
    branches: [ main ]
    paths:
      - "Mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: Mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
