<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rochetta Backend API</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2.5rem;
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            border: 1px solid #334155;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .container:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 0.75rem;
            font-size: 2rem;
            font-weight: 700;
        }
        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .badge-container {
            margin-bottom: 2rem;
        }
        .status-badge {
            display: inline-block;
            background-color: #10b981;
            color: #ffffff;
            padding: 0.375rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.875rem;
            letter-spacing: 0.025em;
        }
        .links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }
        .link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .link:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rochetta Backend</h1>
        <p>Your Node.js Express API server is successfully deployed and running on Vercel.</p>
        <div class="badge-container">
            <span class="status-badge">Status: Online</span>
        </div>
        <div class="links">
            <a class="link" href="/health" target="_blank">Health Check</a>
            <a class="link" href="/api-docs" target="_blank">API Docs</a>
        </div>
    </div>
</body>
</html>
